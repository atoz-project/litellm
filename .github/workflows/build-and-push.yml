name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - custom-aigw
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          # SAE 是 x86,gateway 镜像与本地 build 均 --platform linux/amd64;
          # 不构建 arm64:QEMU 跨架构编译(rust/uv/prisma/next build)是构建耗时主因,
          # 且无消费方(2026-08-22 砍掉,原 linux/amd64,linux/arm64)。
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/huwang/litellm:custom-aigw-${{ steps.vars.outputs.short_sha }}
            ${{ secrets.ACR_REGISTRY }}/huwang/litellm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: |
          echo "Image pushed successfully"
          echo "Tags:"
          echo "  - ${{ secrets.ACR_REGISTRY }}/huwang/litellm:custom-aigw-${{ steps.vars.outputs.short_sha }}"
          echo "  - ${{ secrets.ACR_REGISTRY }}/huwang/litellm:latest"
